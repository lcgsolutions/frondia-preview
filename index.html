<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frondia - Vista previa</title>
<script>
  // Phones and narrow screens get the app full screen.
  if (matchMedia('(max-width: 600px), (pointer: coarse)').matches) {
    location.replace('app/');
  }
</script>
<style>
  :root {
    --bg: #F0F0F3; --text: #000; --muted: #60646C; --primary: #2E7D32;
    --soft: #E3F1E4; --bezel: #111; --border: #D8DADF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --text: #fff; --muted: #B0B4BA; --primary: #66BB6A;
      --soft: #1B2E1C; --bezel: #2E3135; --border: #2E3135;
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 64px;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .info { max-width: 340px; }
  h1 { margin: 0 0 4px; font-size: 40px; color: var(--primary); }
  .caption { margin: 0 0 20px; font-size: 18px; color: var(--muted); }
  .hint { background: var(--soft); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.6; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
  a { display: inline-block; margin-top: 20px; color: var(--primary); font-weight: 600; }
  /* Frame is 414x868; the script below scales it down to fit short windows. The page scrolls if scaling is unavailable. */
  .stage { width: 414px; height: 868px; flex: none; transform-origin: center; }
  .phone { position: relative; width: 414px; height: 868px; padding: 12px; background: var(--bezel); border-radius: 56px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  .notch { position: absolute; top: 12px; left: 50%; width: 140px; height: 28px; margin-left: -70px; background: var(--bezel); border-radius: 0 0 18px 18px; z-index: 1; }
  iframe { width: 390px; height: 844px; border: 0; border-radius: 44px; background: #fff; display: block; }
  @media (max-width: 900px) { .info { display: none; } }
</style>
</head>
<body>
  <div class="info">
    <h1>Frondia</h1>
    <p class="caption">Vista previa interactiva</p>
    <!-- Demo account defined in mobile/src/infrastructure/mock/mock-auth-service.ts; keep in sync. -->
    <div class="hint">
      Para ingresar usa la cuenta demo:<br>
      <code>demo@frondia.cl</code><br>
      <code>demo1234</code>
    </div>
    <a href="app/">Abrir a pantalla completa</a><br>
    <!-- Published by .github/workflows/android-apk.yml; keep the URL in sync. -->
    <a href="https://github.com/lcgsolutions/frondia-preview/raw/apk/frondia.apk">Descargar APK para Android</a>
  </div>
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <iframe src="app/" title="Frondia"></iframe>
    </div>
  </div>
  <script>
    // Unitless scale so the whole frame fits the window height without relying on CSS typed arithmetic.
    (function () {
      var stage = document.querySelector('.stage');
      function fit() {
        var scale = Math.max(0.4, Math.min(1, (window.innerHeight - 32) / 868));
        stage.style.transform = 'scale(' + scale + ')';
        stage.style.margin = ((scale - 1) * 868) / 2 + 'px 0';
      }
      fit();
      window.addEventListener('resize', fit);
    })();
  </script>
</body>
</html>
